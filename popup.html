<!DOCTYPE html>
<html lang="ug">
<head>
  <meta charset="UTF-8">
  <title>PureShield Pro</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #09090e, #1a1c29, #11111d);
      --card-bg: rgba(255, 255, 255, 0.05);
      --neon-glow: 0 0 15px rgba(0, 255, 128, 0.4);
      --accent-green: #00ff88;
      --accent-cyan: #00f2fe;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg-gradient);
      color: var(--text-color);
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .logo {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-green);
      text-shadow: var(--neon-glow);
    }

    .status-badge {
      font-size: 10px;
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid var(--accent-green);
      padding: 3px 8px;
      border-radius: 12px;
      color: var(--accent-green);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #a0aec0;
      display: flex;
      justify-content: space-between;
    }

    .speed-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-cyan);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn {
      width: 100%;
      background: linear-gradient(90deg, #00ff88, #00f2fe);
      border: none;
      color: #000;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.3s;
    }

    .btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(0,255,136,0.5); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🛡️ PURESHIELD PRO</div>
    <div class="status-badge">ئاكتىپ قوغداش</div>
  </div>

  <!-- تور سۈرئىتى ئۆلچىگۈچ -->
  <div class="card">
    <div class="card-title">
      <span>هەقىقىي تور سۈرئىتى</span>
      <span id="pingStatus">تەكشۈرۈلمەكتە...</span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div>
        <span class="speed-value" id="speedResult">--</span>
        <span style="font-size: 11px; color: #a0aec0;">Mbps</span>
      </div>
      <button class="btn" style="width: auto; padding: 6px 12px; font-size: 11px;" id="testSpeedBtn">سۈرئەتنى تەكشۈرۈش</button>
    </div>
  </div>

  <!-- قوغداش ۋە سۈزۈش تەڭشەكلىرى -->
  <div class="card">
    <div class="card-title">مەزمۇن ۋە ئىلان سۈزگۈچلىرى</div>
    
    <div class="toggle-row">
      <span>بارلىق ئىلانلارنى چەكلەش</span>
      <label class="switch">
        <input type="checkbox" id="blockAds" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row" style="margin-top: 10px;">
      <span>يۈزى ئوچۇق سۈرەتلەرنى قەتتىي توسۇش</span>
      <label class="switch">
        <input type="checkbox" id="blockExplicitImages" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
